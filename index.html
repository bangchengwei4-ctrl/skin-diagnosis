<!DOCTYPE html><html lang=zh-CN><head><meta charset=UTF-8><meta name=viewport content=width=device-width,initial-scale=1.0><title>痘痘皮肤自测诊断</title><style>:root{--g:#2d6a4f}*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,PingFang SC,sans-serif;background:#fafafa;color:#171717;min-height:100vh;display:flex}.c{width:100%;max-width:640px;padding:20px;margin:0 auto}.hd{text-align:center;padding:24px 0 16px}.hd h1{font-size:22px}.hd p{font-size:14px;color:#666}.pb{height:6px;background:#e5e5e5;border-radius:3px;margin:0 0 16px;overflow:hidden}.pb-bar{height:100%;background:linear-gradient(90deg,var(--g),#40916c);transition:width .5s;width:0%}.cd{background:#fff;border-radius:12px;padding:24px;margin-bottom:16px;display:none;box-shadow:0 1px 3px rgba(0,0,0,.06)}.cd.a{display:block;animation:fade .35s}@keyframes fade{from{opacity:0}to{opacity:1}}.cd h2{font-size:18px;margin-bottom:8px}.btn{padding:14px 24px;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer}.btn-p{background:var(--g);color:#fff}.btn-p:hover{opacity:.9}.in{text-align:center;padding:20px 0}.in h2{font-size:24px;margin-bottom:8px}.in p{font-size:14px;color:#666;line-height:1.6;margin-bottom:24px}.ql{font-size:14px;font-weight:600;margin-bottom:12px}.ops{display:flex;flex-direction:column;gap:8px}.op{display:flex;align-items:center;padding:12px 16px;border:1.5px solid #ddd;border-radius:8px;cursor:pointer;font-size:14px;gap:10px;user-select:none;transition:all .2s}.op:hover{border-color:var(--g);background:#e8f5e9}.op.s{border-color:var(--g);background:#e8f5e9;font-weight:600}.op .rb{width:20px;height:20px;border:2px solid #ddd;border-radius:50%;flex-shrink:0}.op.s .rb{border-color:var(--g)}.op.s .rb::after{content:;width:10px;height:10px;border-radius:50%;background:var(--g);display:block;margin:3px}.bg{margin-top:16px}.ld{display:none;text-align:center;padding:60px 0;flex-direction:column;align-items:center}.ld.a{display:flex}.ld .sp{width:40px;height:40px;border:4px solid #e5e5e5;border-top-color:var(--g);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}@keyframes spin{to{transform:rotate(360deg)}}.rs{background:linear-gradient(135deg,var(--g),#1b4332);color:#fff;border-radius:12px;padding:20px;margin-bottom:16px}.rs h2{font-size:18px;margin-bottom:8px;color:#fff}.rs p{font-size:14px;line-height:1.6;opacity:.9}.pc{background:#fff;border:1px solid #eee;border-radius:12px;padding:16px;margin-bottom:12px}.pd{background:#e8f5e9;border-radius:6px;padding:8px 12px;margin:6px 0;font-size:13px;color:#2d6a4f}.px{background:#ffe8e8;border-radius:6px;padding:8px 12px;margin:6px 0;font-size:13px;color:#c0392b}@media(max-width:480px){.c{padding:16px}}</style></head><body><div class=c><div class=hd><h1>痘痘皮肤自测诊断</h1><p>6步找到你的痘痘类型与解决方案</p></div><div class=pb><div class=pb-bar id=pb></div></div><div class=cd id=intro><div class=in><h2>开始自测</h2><p>回答几个简单问题,系统会自动分析你的痘痘类型<br>并给出分阶段的护肤方案</p><button class=btn-p onclick=q0()>开始答题</button></div></div><div id=stages></div><div class=ld id=loading><div class=sp></div><p>正在分析你的皮肤状况...</p></div><div id=result style=display:none></div></div><script>var qi=0,an={},qs=[{q:"你长痘主要在哪些位置?",os:[{l:"额头/发际线",v:"fh"},{l:"脸颊",v:"ck"},{l:"下巴/下颌线",v:"jw"},{l:"全脸",v:"al"}]},{q:"痘痘是什么样子的?",os:[{l:"闭口/粉刺(不红不痛)",v:"cl"},{l:"红肿痘(按着痛)",v:"in"},{l:"囊肿/结节(大且深)",v:"cy"}]},{q:"有没有以下规律?",os:[{l:"月经前后加重",v:"ho"},{l:"压力大/熬夜后加重",v:"st"},{l:"吃甜食/牛奶后加重",v:"di"},{l:"换季加重",v:"se"}]},{q:"长痘多长时间了?",os:[{l:"刚几周",v:"nw"},{l:"反复几个月",v:"mo"},{l:"断断续续很多年",v:"yr"}]},{q:"之前用过什么治痘方法?",os:[{l:"没处理过",v:"no"},{l:"刷酸/护肤品",v:"ot"},{l:"看过医生/吃过药",v:"rx"}]}];var st=document.getElementById("stages"),pb=document.getElementById("pb");function q0(){document.getElementById("intro").classList.remove("a");showQ(0);}function showQ(i){if(i>=qs.length){analyze();return;}var q=qs[i];var h="<div class=cd.a><h2>第"+(i+1)+"/"+qs.length+"步</h2><div class=ql>"+q.q+"</div><div class=ops>";for(var j=0;j<q.os.length;j++)h+="<div class=op data-i="+j+"><div class=rb></div><span>"+q.os[j].l+"</span></div>";h+="</div><div class=bg><button class=btn-p id=nx>下一步</button></div></div>";st.innerHTML=h;pb.style.width=((i/qs.length)*85)+"%";document.querySelectorAll(".op").forEach(function(el,k){el.onclick=function(){an[i]=k;document.querySelectorAll(".op").forEach(function(e){e.classList.remove("s")});el.classList.add("s");};});document.getElementById("nx").onclick=function(){if(an[i]===undefined){alert("请选择一个选项");return;}qi=i+1;showQ(qi);};}function analyze(){st.innerHTML="";document.getElementById("loading").classList.add("a");setTimeout(function(){document.getElementById("loading").classList.remove("a");showResult();},1500);}function showResult(){pb.style.width="100%";document.getElementById("result").style.display="block";var r="<div class=rs><h2>分析完成</h2><p>根据你的回答,建议优先关注屏障修护和抗炎。</p></div>";r+="<div class=pc><div class=pd>✅ 建议使用:氨基酸洁面 + B5修护 + 壬二酸</div>";r+="<div class=px>❌ 暂停使用:酸类/A醇/磨砂/荷荷巴油</div></div>";r+="<div class=pc><div class=pd><b>阶段一(第1-2周):</b>纯修护,停用所有功能产品</div>";r+="<div class=pd><b>阶段二(第3-5周):</b>修护打底+壬二酸局部点涂</div>";r+="<div class=pd><b>阶段三(第6-12周):</b>逐步恢复完整护肤流程</div></div>";document.getElementById("result").innerHTML=r;}</script></div></body></html>
